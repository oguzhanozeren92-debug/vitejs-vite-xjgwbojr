name: One-time model readiness route patch

on:
  push:
    branches:
      - feat/open-source-engines-20260913

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/open-source-engines-20260913
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python tools/patch_model_readiness_routes.py
      - run: npm ci
      - run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/field-detail/hooks/useFieldProductionHistory.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(model-engines): wire model readiness routes"
          git push origin HEAD:feat/open-source-engines-20260913

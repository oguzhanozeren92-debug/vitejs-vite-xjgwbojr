name: Model Engine Check

on:
  push:
    branches:
      - feat/open-source-engines-20260913
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lock raw pyfao56 client route
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('supabase/functions/model-engine-shadow/index.ts')
          text = path.read_text()
          pattern = re.compile(
              r"\n\s*if \(engine === 'pyfao56' && operation === 'shadow-run'\) \{\s*"
              r"return '/v1/irrigation/pyfao56/shadow';\s*\}\n"
          )
          updated, count = pattern.subn('\n', text, count=1)
          if count:
              path.write_text(updated)

      - name: Commit security patch if needed
        run: |
          if ! git diff --quiet -- supabase/functions/model-engine-shadow/index.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/functions/model-engine-shadow/index.ts
            git commit -m "security(model-engines): block raw pyfao56 client route [skip ci]"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck legacy app
        continue-on-error: true
        run: npm run typecheck

      - name: Build
        run: npm run build

name: One-time model gateway runtime verification

on:
  push:
    branches:
      - feat/open-source-engines-20260913

jobs:
  core-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/model-gateway/requirements.txt
      - name: Install core gateway dependencies
        working-directory: services/model-gateway
        run: pip install -r requirements.txt
      - name: Verify dependency consistency
        run: pip check
      - name: Compile gateway
        run: python -m py_compile services/model-gateway/app.py services/model-gateway/engine_registry.py services/model-gateway/smoke_test.py
      - name: Run pyfao56 shadow smoke test
        working-directory: services/model-gateway
        run: python smoke_test.py

  pilot-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/model-gateway/requirements-pilot.txt
      - name: Install pilot engine dependencies
        working-directory: services/model-gateway
        run: pip install -r requirements-pilot.txt
      - name: Verify pilot dependency consistency
        run: pip check
      - name: Import PCSE and AquaCrop
        working-directory: services/model-gateway
        run: python -c "import pcse, aquacrop; print('pcse', getattr(pcse, '__version__', 'unknown')); print('aquacrop', getattr(aquacrop, '__version__', 'unknown'))"

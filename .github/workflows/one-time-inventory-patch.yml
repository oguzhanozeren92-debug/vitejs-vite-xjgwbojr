name: One-time inventory patch and build check

on:
  push:
    branches:
      - fix/mobile-shell-map-ui-20260913

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Capture touched-file typecheck baseline
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck-before.log 2>&1
          exit 0

      - name: Patch depot component minimally
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/components/PestStoreScreen.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'Patch target not found: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              "  loadInventoryCache,\n",
              "",
              "remove loadInventoryCache import",
          )
          replace_once(
              "  saveInventoryCache,\n",
              "",
              "remove saveInventoryCache import",
          )

          replace_once(
              """    const load = async () => {\n      const cached = loadInventoryCache(resolvedUser.id);\n      if (active && cached.length) setProducts(cached);\n\n      try {\n        setLoadingProducts(true);\n        const remote = await fetchInventoryProducts(resolvedUser.id);\n\n        if (!active) return;\n\n        setProducts(remote);\n        setInventoryMessage('');\n      } catch (error) {\n        if (!active) return;\n\n        setInventoryMessage(\n          `Supabase depo verisi alınamadı. ${\n            cached.length\n              ? 'Önbellekteki ürünler gösteriliyor.'\n              : 'SQL kurulumunu yaptıktan sonra tekrar dene.'\n          } ${\n            error instanceof Error ? `(${error.message})` : ''\n          }`,\n        );\n      } finally {\n        if (active) setLoadingProducts(false);\n      }\n    };\n""",
              """    const load = async () => {\n      try {\n        setLoadingProducts(true);\n        const remote = await fetchInventoryProducts(resolvedUser.id);\n\n        if (!active) return;\n\n        setProducts(remote);\n        setInventoryMessage('');\n      } catch (error) {\n        if (!active) return;\n\n        setProducts([]);\n        setInventoryMessage(\n          `Depo verisi alınamadı; yerel stok gösterilmiyor. ${\n            error instanceof Error ? `(${error.message})` : ''\n          }`,\n        );\n      } finally {\n        if (active) setLoadingProducts(false);\n      }\n    };\n""",
              "remote-only inventory load",
          )

          replace_once(
              """  const upsertProductState = (\n    product: InventoryProduct,\n    cacheUserId: string | null = resolvedUser?.id ?? null,\n  ) => {\n    setProducts((current) => {\n      const next = [\n        product,\n        ...current.filter((item) => item.id !== product.id),\n      ];\n\n      if (cacheUserId) {\n        saveInventoryCache(cacheUserId, next);\n      }\n\n      return next;\n    });\n  };\n""",
              """  const upsertProductState = (product: InventoryProduct) => {\n    setProducts((current) => [\n      product,\n      ...current.filter((item) => item.id !== product.id),\n    ]);\n  };\n""",
              "remove stock cache writes",
          )

          replace_once(
              "upsertProductState(saved, currentUser.id);",
              "upsertProductState(saved);",
              "update remote save state call",
          )

          replace_once(
              """      } catch (remoteError) {\n        const now = new Date().toISOString();\n\n        const localProduct: InventoryProduct = {\n          id:\n            typeof crypto !== 'undefined' &&\n            'randomUUID' in crypto\n              ? `local-${crypto.randomUUID()}`\n              : `local-${Date.now()}`,\n          userId: currentUser.id,\n          ...input,\n          createdAt: now,\n          updatedAt: now,\n        };\n\n        upsertProductState(localProduct, currentUser.id);\n\n        setAnalysisMessage(\n          `Supabase kaydı yapılamadı; ürün geçici olarak cihaz önbelleğine kaydedildi. ${\n            remoteError instanceof Error\n              ? remoteError.message\n              : ''\n          }`,\n        );\n      }\n""",
              """      } catch (remoteError) {\n        throw remoteError;\n      }\n""",
              "remove local product fallback",
          )

          replace_once(
              """      if (editingProduct.id.startsWith('local-')) {\n        const updated: InventoryProduct = {\n          ...editingProduct,\n          ...editDraft,\n          updatedAt: new Date().toISOString(),\n        };\n        upsertProductState(updated);\n      } else {\n        const updated = await updateInventoryProduct(\n          resolvedUser.id,\n          editingProduct.id,\n          editDraft,\n        );\n        upsertProductState(updated);\n      }\n""",
              """      const updated = await updateInventoryProduct(\n        resolvedUser.id,\n        editingProduct.id,\n        editDraft,\n      );\n      upsertProductState(updated);\n""",
              "remove local edit path",
          )

          replace_once(
              """      if (!product.id.startsWith('local-')) {\n        await removeInventoryProduct(resolvedUser.id, product.id);\n      }\n\n      setProducts((current) => {\n        const next = current.filter((item) => item.id !== product.id);\n        saveInventoryCache(resolvedUser.id, next);\n        return next;\n      });\n""",
              """      await removeInventoryProduct(resolvedUser.id, product.id);\n\n      setProducts((current) =>\n        current.filter((item) => item.id !== product.id),\n      );\n""",
              "remove local delete path",
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Check for new touched-file type errors
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck-after.log 2>&1
          set -e
          python3 <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          targets = (
              'src/components/PestStoreScreen.tsx',
              'src/services/pestStoreService.ts',
          )

          def normalized(path: str):
              rows = []
              for line in Path(path).read_text(encoding='utf-8', errors='ignore').splitlines():
                  if not any(target in line for target in targets):
                      continue
                  line = re.sub(r'\(\d+,\d+\)', '(LINE,COL)', line)
                  rows.append(line.strip())
              return Counter(rows)

          before = normalized('/tmp/typecheck-before.log')
          after = normalized('/tmp/typecheck-after.log')
          introduced = after - before

          print('Touched-file baseline errors:')
          for row, count in before.items():
              print(f'  {count}x {row}')
          print('Touched-file errors after patch:')
          for row, count in after.items():
              print(f'  {count}x {row}')

          if introduced:
              print('New touched-file TypeScript errors introduced by patch:')
              for row, count in introduced.items():
                  print(f'  {count}x {row}')
              raise SystemExit(1)

          print('No new TypeScript errors were introduced in touched files.')
          PY

      - name: Build
        run: npm run build

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PestStoreScreen.tsx
          if git diff --cached --quiet; then
            echo "No component changes to commit."
            exit 0
          fi
          git commit -m "fix(inventory): remove client-side stock fallback [inventory-patch]"
          git push origin HEAD:${GITHUB_REF_NAME}

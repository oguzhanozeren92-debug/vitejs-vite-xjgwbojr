name: Model Gateway CI

on:
  pull_request:
    paths:
      - 'services/model-gateway/**'
      - 'src/features/model-engines/**'
      - 'src/features/irrigation/services/historicalKcReconstruction.service.ts'
      - 'supabase/functions/model-engine-shadow/**'
      - 'supabase/functions/model-engine-readiness/**'
      - 'tools/check-model-engine-contracts.py'
      - '.github/workflows/model-gateway-ci.yml'
  push:
    branches:
      - 'feat/open-source-engines-20260913'
    paths:
      - 'services/model-gateway/**'
      - 'src/features/model-engines/**'
      - 'src/features/irrigation/services/historicalKcReconstruction.service.ts'
      - 'supabase/functions/model-engine-shadow/**'
      - 'supabase/functions/model-engine-readiness/**'
      - 'tools/check-model-engine-contracts.py'
      - '.github/workflows/model-gateway-ci.yml'

permissions:
  contents: read

jobs:
  contract-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify model-engine contracts stay synchronized
        run: python tools/check-model-engine-contracts.py
      - name: Verify readiness trust boundary
        run: |
          grep -q "input_authority: 'server-derived'" supabase/functions/model-engine-readiness/index.ts
          grep -q "client_supplied_available_inputs_ignored: true" supabase/functions/model-engine-readiness/index.ts
          grep -q "model-engine-readiness" src/features/model-engines/services/modelEngineShadow.service.ts
          if grep -q "available_inputs: availableInputs" src/features/model-engines/services/modelEngineShadow.service.ts; then
            echo "Client-controlled readiness inputs reintroduced"
            exit 1
          fi

  frontend-shadow-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint shadow integration files
        run: >-
          npx oxlint
          src/features/model-engines/services/modelEngineShadow.service.ts
          src/features/irrigation/services/historicalKcReconstruction.service.ts
      - name: Build frontend
        run: npm run build

  core-shadow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/model-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: services/model-gateway/.python-version
          cache: 'pip'
          cache-dependency-path: services/model-gateway/requirements.txt
      - name: Validate deploy configuration
        run: |
          python -m json.tool vercel.json >/dev/null
          test "$(cat .python-version)" = "3.12"
      - name: Install core dependencies
        run: pip install -r requirements.txt
      - name: Verify dependency consistency
        run: pip check
      - name: Compile gateway
        run: python -m py_compile app.py engine_registry.py smoke_test.py
      - name: Run shadow smoke test
        run: python smoke_test.py

  pilot-imports:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/model-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: services/model-gateway/.python-version
          cache: 'pip'
          cache-dependency-path: |
            services/model-gateway/requirements.txt
            services/model-gateway/requirements-pilot.txt
      - name: Install pilot dependencies
        run: pip install -r requirements.txt -r requirements-pilot.txt
      - name: Verify pilot dependency consistency
        run: pip check
      - name: Import pilot engines
        run: python -c "import pcse, aquacrop; print('pilot imports ok')"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t tarlapusula-model-gateway:ci services/model-gateway

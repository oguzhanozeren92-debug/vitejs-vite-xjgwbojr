name: Model Gateway CI

on:
  pull_request:
    paths:
      - 'services/model-gateway/**'
      - '.github/workflows/model-gateway-ci.yml'
  push:
    branches:
      - 'feat/open-source-engines-20260913'
    paths:
      - 'services/model-gateway/**'
      - '.github/workflows/model-gateway-ci.yml'

permissions:
  contents: read

jobs:
  core-shadow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/model-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: services/model-gateway/.python-version
          cache: 'pip'
          cache-dependency-path: services/model-gateway/requirements.txt
      - name: Validate deploy configuration
        run: |
          python -m json.tool vercel.json >/dev/null
          test "$(cat .python-version)" = "3.12"
      - name: Install core dependencies
        run: pip install -r requirements.txt
      - name: Verify dependency consistency
        run: pip check
      - name: Compile gateway
        run: python -m py_compile app.py engine_registry.py smoke_test.py
      - name: Run shadow smoke test
        run: python smoke_test.py

  pilot-imports:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/model-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: services/model-gateway/.python-version
          cache: 'pip'
          cache-dependency-path: |
            services/model-gateway/requirements.txt
            services/model-gateway/requirements-pilot.txt
      - name: Install pilot dependencies
        run: pip install -r requirements.txt -r requirements-pilot.txt
      - name: Verify pilot dependency consistency
        run: pip check
      - name: Import pilot engines
        run: python -c "import pcse, aquacrop; print('pilot imports ok')"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t tarlapusula-model-gateway:ci services/model-gateway

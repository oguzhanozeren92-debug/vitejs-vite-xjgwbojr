name: One-time model engines check

on:
  push:
    branches:
      - feat/open-source-engines-20260913

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: python -m py_compile services/model-gateway/app.py services/model-gateway/engine_registry.py
